# Configuración funcional del hub. Las claves van en .env, nunca aquí.
# Cambiar este archivo no requiere reconstruir: basta con
#   docker compose restart core

boveda:
  bandeja: 00-Bandeja
  diario: Diario
  proyectos: Proyectos
  interna: _hub
  # Un proyecto nuevo es solo su carpeta y _proyecto.md (decidido el 2026-09-30): las carpetas y
  # archivos aparecen cuando hay algo que guardar. Dónde va cada nota lo decide el redactor
  # (proveedores.redactor); el esquema por tipo de abajo queda de respaldo si GPT no responde.
  # Fichas nuevas de personaje (si el proyecto ya tiene Historia/Personajes, se usa esa):
  personajes: Personajes
  # Respaldo sin GPT: tipo de nota -> archivo del proyecto (Ideas.md, Historia.md…)
  destino_por_tipo:
    idea: Ideas
    general: Ideas
    historia: Historia
    dialogo: Historia
    produccion: Produccion
    analisis: Analisis

router:
  motor: local            # local | jev (jev es opcional, fase 2)
  umbral_ejecutar: 0.80   # >= ejecuta directo
  umbral_confirmar: 0.50  # entre ambos: pide confirmación con botones
  umbral_ia_ejecutar: 0.85  # si el clasificador duda y ChatGPT está así de seguro, se ejecuta directo
  acciones: [nota, tarea, imagen, referencia, referencia_personaje, consulta, analisis, busqueda]
  tipos_nota: [idea, historia, produccion, dialogo, general]
  # Segunda opinión cuando el clasificador duda: ChatGPT → Haiku por OpenClaw; sin OpenClaw,
  # el LLM local (Ollama) si proveedores.llm_local.activo.
  segunda_opinion: true
  llm_timeout_s: 15
  # Intérprete (decidido el 2026-09-29): ChatGPT entiende cada mensaje libre (acción, destino, contenido
  # sin la orden, personaje, prompt de imagen) con un contexto corto (~400-600 tokens por mensaje).
  # Comandos y órdenes habladas de prefijo fijo siguen en local; si GPT no responde, decide el router
  # local (reglas + SetFit). activo: false vuelve al esquema anterior (GPT solo si SetFit duda).
  # modelo/razonamiento: debe estar en allowedCompletionModels (openclaw/fragmento-config.json5).
  interprete: {activo: true, modelo: openai/gpt-6-sol, razonamiento: low, timeout_s: 30, max_tokens: 500}
  # Cómo se entrena el clasificador (/reentrenar y ./hub.sh entrenar). Elegido el 2026-09-29 midiendo
  # con frases que nunca se entrenan (docs/BITACORA.md): mpnet acierta más que MiniLM (94 % contra
  # 91 % en la prueba ciega). "congelar_vocabulario" deja fija la tabla de palabras: con pocos
  # ejemplos no aporta y así cabe en 4 GB. Cambiar la base exige ./hub.sh modelos y reentrenar.
  # Un modelo nuevo que salga peor que el actual en las pruebas se descarta solo.
  entrenamiento:
    base: sentence-transformers/paraphrase-multilingual-mpnet-base-v2
    iteraciones: 10
    epocas: 1
    congelar_vocabulario: true

proveedores:
  # Consulta y dudas del router, por OpenClaw (plugin hub-puente), en orden y con el menor
  # razonamiento que acepta cada modelo (gpt-6-luna no admite "off"). "aislado": el modelo
  # es un programa (Claude Code) y recibe un solo mensaje. Cada modelo nuevo debe estar
  # también en openclaw/fragmento-config.json5 (allowedCompletionModels).
  # Después del MVP: OpenRouter :free y qwen local como respaldo.
  consulta:
    - {modelo: openai/gpt-6-luna, razonamiento: low}
    - {modelo: claude-cli/claude-haiku-4-5, razonamiento: "off", aislado: true}
  # Redactor (decidido el 2026-09-30): con tu mensaje y el contenido real del proyecto decide qué
  # escribir y dónde (archivo existente, sección de una ficha, archivo o ficha nueva, varios a la vez)
  # o te pregunta si falta algo. Solo agrega; nunca borra ni sale del proyecto. Si no responde, la nota
  # se guarda por tipo como antes. Medido el 2026-09-30 con 9 mensajes reales: "low" organiza igual de
  # bien que "medium" y tarda 2-7 s (medium, 3-13 s). Si notas errores de criterio, prueba "medium".
  # tope_contexto_tokens: cuánto del proyecto lee (lo más relacionado primero).
  redactor: {activo: true, modelo: openai/gpt-6-sol, razonamiento: low, timeout_s: 90, max_tokens: 3000,
             tope_contexto_tokens: 12000}
  # La consulta lee las notas del proyecto activo hasta este tope (0 = sin notas).
  consulta_notas_tokens: 6000
  llm_local:
    # Apagado en el MVP: el router usa SetFit + reglas y las imágenes usan la idea tal cual.
    # Vuelve (true) con las medidas ante fallos: segunda opinión, prompts y último respaldo.
    activo: false
    modelo: qwen2.5:3b-instruct-q4_K_M
  analisis:               # decisión 4: siempre con confirmación por botones, nunca cambio automático
    # Un botón por opción, en este orden. /modelo elige el predeterminado (va primero, con ✓).
    # Después de elegir el modelo se elige el esfuerzo: "esfuerzos" son los niveles que acepta
    # (verificados en OpenClaw el 2026-09-28; Opus no acepta "off"); el primero es el de por
    # defecto (decisión 3). "extra_tokens": prompt propio que agrega Claude Code.
    # Cada modelo debe estar también en openclaw/fragmento-config.json5 (allowedCompletionModels).
    recomendado: claude-cli/claude-opus-5-5
    opciones:
      - {modelo: claude-cli/claude-opus-5-5, nombre: Opus 5.5, aislado: true, extra_tokens: 3700,
         esfuerzos: [low, medium, high, xhigh, max]}
      - {modelo: claude-cli/claude-sonnet-5, nombre: Sonnet 5, aislado: true, extra_tokens: 3700,
         esfuerzos: ["off", low, medium, high, xhigh, max]}
      - {modelo: openai/gpt-6-sol, nombre: GPT-6 Sol, esfuerzos: [low, medium, high, xhigh]}
    tope_tokens_entrada: 20000      # notas que entran (estimado); el resto se deja fuera o se recorta
    max_tokens_salida: 2500
    tiempo_max_s: 300               # un análisis grande tarda más que una consulta
    espera_confirmacion_min: 10     # los botones caducan
  imagen:                 # se prueban en orden; si todos fallan: mensaje + /diagnostico
    - {nombre: chatgpt, activo: true, modelo: gpt-image-2, calidad: low, tamano: 1024x1536}  # suscripción vía OpenClaw (~55 s)
    # MVP: solo suscripciones pagas (OpenAI y Claude). Cloudflare y tensor.art se evalúan después del MVP.
    - {nombre: cloudflare, activo: false, modelo: flux-1-schnell, pasos: 4}  # gratis a diario
    - {nombre: tensorart, activo: false, modelo_id: "600423083519508503", pasos: 15,
       ancho: 768, alto: 1024, sampler: "DPM++ 2M Karras"}                 # créditos de regalo

voz:
  # Pista de ortografía para Whisper. En español latinoamericano la z y la s suenan igual
  # ("sorro" por "zorro"): las palabras de aquí se escriben bien al transcribir.
  # Desde el 2026-09-30 cada audio lleva además, delante, el proyecto activo, sus personajes (con
  # alias) y los demás proyectos: no hace falta agregar aquí los nombres ("Dikon" -> "Deacon").
  # Agrega nombres de personajes, lugares y términos del proyecto (máx. ~400 caracteres).
  vocabulario: "Notas en español latinoamericano sobre un webtoon: zorro, villana, protagonista, hermana, storyboard, viñeta, entintado, boceto, capítulo, escena, Zamael. Crea una imagen en estilo anime de una elfa."

cortacircuitos: {fallos: 3, espera_min: 5}

limpieza:
  hora: "04:00"                   # hora local de la limpieza diaria
  audio_crudo: borrar_tras_transcribir
  temp_dir_horas: 24              # datos/tmp
  logs_dias: 14                   # datos/logs
  imagenes_descartadas_dias: 7    # datos/descartadas
  temporales_boveda_horas: 1      # restos .*.tmp de escrituras interrumpidas

latido:
  intervalo_s: 60
  vigencia_s: 180
